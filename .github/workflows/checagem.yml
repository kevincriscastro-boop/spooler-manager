name: Checagem de dados sensiveis

# Roda em todo push e pull request: gitleaks (senhas, tokens, chaves) em todo
# o historico + checagem de IPs e termos do ambiente real. O mesmo script
# roda antes de cada commit local (.githooks/pre-commit) e antes do deploy.
on:
  push:
  pull_request:

jobs:
  checagem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: IPs e termos do ambiente real
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
        run: |
          # Em pull requests de forks o secret nao chega - checa so IPs.
          printf '%s\n' "$SENSITIVE_PATTERNS" > "$RUNNER_TEMP/padroes.txt"
          bash .github/scripts/checar-dados-sensiveis.sh "$RUNNER_TEMP/padroes.txt"

      - name: gitleaks (segredos no historico)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
